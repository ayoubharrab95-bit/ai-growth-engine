name: Agent PR Metadata

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: agent-pr-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Label agent submission
    runs-on: ubuntu-latest
    steps:
      - name: Label agent PRs
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const branch = pr.head.ref;

            if (!branch.startsWith('agent/')) {
              core.info('Not an agent branch; no metadata changes required.');
              return;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: ['agent-submission', 'needs-review']
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: [
                '## 🤖 Agent submission detected',
                '',
                'This workflow only records submission metadata.',
                '',
                '- PR validation is handled by **Bounty PR Preflight**.',
                '- Acceptance is based on actual repository tests and bounty requirements.',
                '- This workflow does **not** score, approve, merge, or trigger payment.'
              ].join('\\n')
            });
