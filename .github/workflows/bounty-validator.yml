name: Bounty PR Preflight

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: bounty-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Safe PR preflight
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch base commit
        run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}

      - name: Validate PR metadata and changed files
        id: preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail

          fail() {
            echo "result=fail" >> "$GITHUB_OUTPUT"
            echo "reason=$1" >> "$GITHUB_OUTPUT"
            echo "::error::$1"
            exit 0
          }

          [[ "$HEAD_REF" != "main" && "$HEAD_REF" != "master" ]] || fail "PR must use a dedicated feature branch."

          ISSUE_NUMBER="$(printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | grep -oE '#[0-9]+' | head -1 | tr -d '#' || true)"
          [[ -n "$ISSUE_NUMBER" ]] || fail "No linked issue found. Reference the bounty issue as #N or use 'closes #N'."

          ISSUE_JSON="$(gh issue view "$ISSUE_NUMBER" --repo "$BASE_REPO" --json state,labels,title 2>/dev/null || true)"
          [[ -n "$ISSUE_JSON" ]] || fail "Linked issue #$ISSUE_NUMBER could not be read."
          ISSUE_STATE="$(printf '%s' "$ISSUE_JSON" | jq -r '.state')"
          [[ "$ISSUE_STATE" == "OPEN" ]] || fail "Linked issue #$ISSUE_NUMBER is not open."

          mapfile -t FILES < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          [[ "${#FILES[@]}" -gt 0 ]] || fail "PR contains no file changes."

          for file in "${FILES[@]}"; do
            if [[ -f "$file" && ! -s "$file" ]]; then
              fail "PR contains an empty file: $file"
            fi
          done

          {
            echo "result=pass"
            echo "reason=Preflight passed for issue #$ISSUE_NUMBER (${#FILES[@]} changed files)."
            echo "issue_number=$ISSUE_NUMBER"
            echo "head_repo=$HEAD_REPO"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.preflight.outputs.result == 'pass'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci --ignore-scripts
          elif [[ -f package.json ]]; then
            npm install --ignore-scripts
          fi

      - name: Run project tests
        id: tests
        if: steps.preflight.outputs.result == 'pass'
        shell: bash
        run: |
          set -euo pipefail
          TESTED=0

          if [[ -f package.json ]]; then
            if node -e 'const p=require("./package.json"); process.exit(p.scripts?.test ? 0 : 1)' 2>/dev/null; then
              npm test
              TESTED=1
            fi
          fi

          if [[ -f deno.json || -f deno.jsonc ]]; then
            if compgen -G "tests/**/*.test.ts" > /dev/null || compgen -G "tests/*.test.ts" > /dev/null; then
              deno test --allow-env --allow-net tests/
              TESTED=1
            fi
          fi

          echo "Test suites executed: $TESTED"
          if [[ "$TESTED" -eq 0 ]]; then
            echo "No configured test suite found; continuing with structural preflight."
          fi

      - name: Comment preflight result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RESULT: ${{ steps.preflight.outputs.result }}
          REASON: ${{ steps.preflight.outputs.reason }}
        run: |
          set -euo pipefail
          if [[ "$RESULT" == "pass" ]]; then
            BODY="✅ **PR Preflight passed.** $REASON\n\nTests completed without being suppressed. This workflow does **not** auto-approve or auto-merge the PR."
          else
            BODY="❌ **PR Preflight blocked this submission.** ${REASON:-Preflight did not complete.} Fix the reported issue and push again."
          fi
          gh pr comment "$PR_NUMBER" --body "$BODY"
